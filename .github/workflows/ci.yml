name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:9-chromium
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_TEST_URL: mysql://root:mysql@127.0.0.1:3306/
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      NATS_TEST_URL: nats://127.0.0.1:4222
      GOTENBERG_TEST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      # 服务容器不能传启动参数，队列驱动需要开启 JetStream（-js），因此 NATS 在这里启动。
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 nats:2-alpine -js

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration
        run: go test -tags=integration ./...
