name: ci

on:
  push:
    branches: [main]
  pull_request:

# 检查和测试是两个并行的 job：检查不需要服务容器，测试不等检查做完。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      # 提交的 templ 代码必须是最新生成的。
      - name: Generated code
        run: cd web/ui && go tool templ generate && git diff --exit-code -- .

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      gotenberg:
        image: gotenberg/gotenberg:9-chromium
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6334:6334
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      REDIS_CLUSTER_TEST_URL: redis://127.0.0.1:7000
      MEMCACHED_TEST_ADDR: 127.0.0.1:11211
      NSQD_TEST_ADDR: 127.0.0.1:4150
      NSQD_TEST_HTTP: http://127.0.0.1:4151
      GOTENBERG_TEST_URL: http://127.0.0.1:3000
      QDRANT_TEST_ADDR: 127.0.0.1:6334
    steps:
      - uses: actions/checkout@v4

      # 服务容器不能传启动参数，Redis 集群、nsqd 和 PostgreSQL 在这里启动。
      # 集群由三个主节点组成，节点向客户端报告 127.0.0.1，所以端口原样映射。
      - name: Start Redis cluster
        run: |
          docker run -d --name redis-cluster -p 127.0.0.1:7000-7002:7000-7002 \
            -v "$PWD/internal/redistest/cluster.sh:/cluster.sh:ro" redis:8 sh /cluster.sh 7000 7001 7002
          for i in $(seq 1 60); do docker exec redis-cluster redis-cli -p 7000 cluster info | grep -q cluster_state:ok && exit 0; sleep 1; done
          docker logs redis-cluster
          exit 1

      - name: Start nsqd
        run: docker run -d --name nsqd -p 4150:4150 -p 4151:4151 nsqio/nsq:v1.3.0 /nsqd --mem-queue-size=0

      # 队列用逻辑复制转发任务；每个测试数据库一个复制槽，并行测试需要很多个。
      # 包内的测试并行运行，每个测试有自己的库和连接池，连接数上限也要调高。
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18 \
            -c wal_level=logical -c max_replication_slots=256 -c max_wal_senders=64 -c max_connections=500
          for i in $(seq 1 60); do docker exec postgres pg_isready -U postgres -h 127.0.0.1 && exit 0; sleep 1; done
          docker logs postgres
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
