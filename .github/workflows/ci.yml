name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      gotenberg:
        image: gotenberg/gotenberg:9-chromium
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      MEMCACHED_TEST_ADDR: 127.0.0.1:11211
      NSQD_TEST_ADDR: 127.0.0.1:4150
      GOTENBERG_TEST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      # 服务容器不能传启动参数，nsqd 在这里启动。
      - name: Start nsqd
        run: docker run -d --name nsqd -p 4150:4150 -p 4151:4151 nsqio/nsq:v1.3.0 /nsqd --mem-queue-size=0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      # 提交的 templ 代码必须是最新生成的。
      - name: Generated code
        run: cd web/ui && go tool templ generate && git diff --exit-code -- .

      - name: Test
        run: go test ./...
