# 集成测试用的临时服务，用法见 docs/contributions.md#integration-tests。
# 版本与 CI 一致；数据放在 tmpfs 中，down -v 之后不留任何东西。
name: mygoravel-test

services:
  postgres:
    image: postgres:18
    # 队列用逻辑复制转发任务（docs/queue.md）；每个测试数据库一个复制槽，并行测试需要很多个。
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=256, -c, max_wal_senders=64]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 1s
      retries: 60

  redis:
    image: redis:8
    ports:
      - 127.0.0.1:56379:6379
    tmpfs:
      - /data
    healthcheck:
      test: redis-cli ping
      interval: 1s
      retries: 30

  memcached:
    image: memcached:1.6-alpine
    ports:
      - 127.0.0.1:51211:11211
    healthcheck:
      test: nc -z 127.0.0.1 11211
      interval: 1s
      retries: 30

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: ["/nsqd", "--mem-queue-size=0", "--data-path=/data"]
    ports:
      - 127.0.0.1:54150:4150
      - 127.0.0.1:54151:4151
    tmpfs:
      - /data
    healthcheck:
      test: wget -qO- http://127.0.0.1:4151/ping
      interval: 1s
      retries: 30

  gotenberg:
    image: gotenberg/gotenberg:9-chromium
    ports:
      - 127.0.0.1:53000:3000
    healthcheck:
      test: curl -sf http://127.0.0.1:3000/health
      interval: 1s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - 127.0.0.1:56333:6333
      - 127.0.0.1:56334:6334
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 1s
      retries: 30
